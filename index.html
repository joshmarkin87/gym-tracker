<style>

<script>
// Standalone mode: outside Claude, the tracker keeps its "account" on this phone (IndexedDB) and saves files itself.
(function(){
if(window.claude)return;
window.__SA=true;
const NAME='gym-tracker',ST='docs';let dbp=null;
const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST)};r.onsuccess=()=>res(r.result);r.onerror=()=>{dbp=null;rej(r.error)}}));
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const done=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error||new Error('write failed'))});
const cl=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
async function get(k){const d=await open();return req(d.transaction(ST).objectStore(ST).get(k))}
async function put(k,v){const d=await open(),t=d.transaction(ST,'readwrite');t.objectStore(ST).put(cl(v),k);return done(t)}
async function del(k){const d=await open(),t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(k);return done(t)}
async function list(p,n){const d=await open();return req(d.transaction(ST).objectStore(ST).getAll(IDBKeyRange.bound(p,p+'￿'),n))}
const doc=k=>({get:async()=>{const v=await get(k);return{exists:v!==undefined,data:()=>cl(v)}},set:v=>put(k,v),delete:()=>del(k)});
const db={doc,collection:p=>({doc:id=>doc(p+'/'+id),limit:n=>({get:async()=>({docs:(await list(p+'/',n)).map(v=>({data:()=>cl(v)}))})})})};
// saving a file: share sheet (Save to Files, AirDrop, Messages) when the phone allows it, otherwise a tap-to-save bar
function bar(f){return new Promise(res=>{const u=URL.createObjectURL(f),b=document.createElement('div');b.className='sabar';
b.innerHTML='<span><b>File ready</b><small></small></span><a href="'+u+'" download="'+f.name.replace(/["<&]/g,'')+'">Save</a><button type="button" aria-label="Close">×</button>';b.querySelector('small').textContent=f.name;
const end=ok=>{b.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);res(ok)};b.querySelector('a').addEventListener('click',()=>setTimeout(()=>end(true),300));b.querySelector('button').addEventListener('click',()=>end(false));document.body.appendChild(b)})}
const downloads={save:async({filename,data})=>{const f=new File([data],filename,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}}
if(!(await bar(f)))throw{code:'declined'}}};
window.claude={use:async n=>n==='db'?db:n==='user'?{id:async()=>'me'}:n==='downloads'?downloads:null};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
