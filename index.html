<script>
// Standalone mode: outside Claude, the tracker keeps its "account" on this phone (IndexedDB) and saves files itself.
(function(){
if(window.claude)return;
window.__SA=true;
const NAME='gym-tracker',ST='docs';let dbp=null;
const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST)};r.onsuccess=()=>res(r.result);r.onerror=()=>{dbp=null;rej(r.error)}}));

const done=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error||new Error('write failed'))});
const cl=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
async function get(k){const d=await open();return req(d.transaction(ST).objectStore(ST).get(k))}
// p93: the tracker document has a revision number beside it (key + '~rev'), raised by every write in the same
// transaction, so a save can tell whether another copy of the app (a second tab) saved in between.
const RK=k=>k+'~rev',isT=k=>/\/tracker$/.test(k);
async function put(k,v){const d=await open(),t=d.transaction(ST,'readwrite'),s=t.objectStore(ST);s.put(cl(v),k);if(isT(k)){const r=s.get(RK(k));r.onsuccess=()=>{try{s.put((+r.result||0)+1,RK(k))}catch(e){try{t.abort()}catch(x){}}}}return done(t)}
async function del(k){const d=await open(),t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(k);return done(t)}
async function list(p,n){const d=await open();return req(d.transaction(ST).objectStore(ST).getAll(IDBKeyRange.bound(p,p+'￿'),n))}
// p93: every record under a prefix, read 500 at a time (backups had a 1,000 cap)
async function listAll(p){const d=await open(),out=[];let lo=p,ex=false;for(;;){const s=d.transaction(ST).objectStore(ST),r=IDBKeyRange.bound(lo,p+'￿',ex,false);const[ks,vs]=await Promise.all([req(s.getAllKeys(r,500)),req(s.getAll(r,500))]);for(const v of vs)out.push(v);if(ks.length<500)return out;lo=ks[ks.length-1];ex=true}}
async function count(p){const d=await open();return req(d.transaction(ST).objectStore(ST).count(IDBKeyRange.bound(p,p+'￿')))}
async function getRev(k){const d=await open();return new Promise((res,rej)=>{const t=d.transaction(ST),s=t.objectStore(ST),a=s.get(k),b=s.get(RK(k));t.oncomplete=()=>res({exists:a.result!==undefined,data:()=>cl(a.result),rev:+b.result||0});t.onerror=t.onabort=()=>rej(t.error||new Error('read failed'))})}

async function setIf(k,v,rev,guard){const d=await open();return new Promise((res,rej)=>{const t=d.transaction(ST,'readwrite'),s=t.objectStore(ST),a=s.get(RK(k)),b=s.get(k);let out=null,err=null;
b.onsuccess=()=>{try{const cur=+a.result||0,old=b.result;if(rev!=null&&cur!==rev){out={ok:false,rev:cur,v:cl(old)};return}
const why=guard&&old!==undefined?guard(old,v):'';if(why){out={ok:false,refused:why,rev:cur,v:cl(old)};return}
s.put(cl(v),k);s.put(cur+1,RK(k));out={ok:true,rev:cur+1}}catch(e){err=e;try{t.abort()}catch(x){}}};
t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(err||t.error||new Error('write failed'))})}
const doc=k=>({get:async()=>{const v=await get(k);return{exists:v!==undefined,data:()=>cl(v)}},set:v=>put(k,v),delete:()=>del(k),getRev:()=>getRev(k),setIf:(v,rev,g)=>setIf(k,v,rev,g)});
const db={doc,collection:p=>({doc:id=>doc(p+'/'+id),limit:n=>({get:async()=>({docs:(await list(p+'/',n)).map(v=>({data:()=>cl(v)}))})}),all:async()=>({docs:(await listAll(p+'/')).map(v=>({data:()=>cl(v)}))}),count:()=>count(p+'/')})};
// p93: a restore replaces everything in one transaction: the archives are emptied (the previous person's archived workouts
// and food days go), the backup's archive and tracker are written, and the revision is raised. If any part fails, nothing changes.
const TK='data/users/me/tracker';
window.__saRestore=async(doc,ss,fd)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(ST,'readwrite'),s=t.objectStore(ST),sp=TK+'/sessions/',fp=TK+'/food/';let rev=0,err=null;

// p93: checking a backup before it's restored. A file that isn't a tracker backup is refused. Every field is checked: an entry
// that can't be used (no valid date, a weigh-in with no weight, a scan with no results, a workout with no sets) is left out
// and listed for the person; an optional number that isn't one loses only that field; a field of the wrong kind starts
// empty. Valid data comes back unchanged (the same objects), so a good backup restores exactly.
const saO=x=>!!x&&typeof x==='object'&&!Array.isArray(x),saDay=t=>typeof t==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t)&&!isNaN(Date.parse(t+'T12:00:00Z'));

// p108: ev (the Weight tab's events, S.ev = [{t, k}]) is checked like the other dated lists
const FX={
log:e=>{if(!base(e)||!saO(e.s))return null;let c=null;for(const n in e.s){const r=e.s[n];if(Array.isArray(r)&&r.every(Array.isArray))continue;c=c||Object.assign({},e.s);const f=Array.isArray(r)?r.filter(Array.isArray):[];if(f.length)c[n]=f;else delete c[n]}

wt:e=>{if(!base(e))return null;const w=saNum(e.w);return w==null||!(w>0&&w<2000)?null:w===e.w?e:Object.assign({},e,{w})},
waist:e=>{if(!base(e))return null;const v=saNum(e.v);return v==null||!(v>0)?null:v===e.v?e:Object.assign({},e,{v})},
food:e=>{if(!base(e))return null;let x=nf(e,['b','c','p','pg','cb','cg','f','fg','fi','na','su','sf']);if(x.m!=null&&!(Array.isArray(x.m)&&x.m.every(saO))){x=x===e?Object.assign({},e):x;if(Array.isArray(x.m)&&x.m.some(saO))x.m=x.m.filter(saO);else{delete x.m;delete x.mf}}return x},
hl:e=>base(e)?nf(e,['st','sl','hr']):null,
scans:e=>base(e)&&['tm','fm','lm'].every(k=>typeof e[k]==='number'&&isFinite(e[k])&&e[k]>0)?e:null,
labs:e=>{if(!base(e)||!saO(e.v))return null;const ks=Object.keys(e.v);if(ks.every(k=>saO(e.v[k])))return ks.length?e:null;const v={};for(const k of ks)if(saO(e.v[k]))v[k]=e.v[k];return Object.keys(v).length?Object.assign({},e,{v}):null},
phases:e=>saO(e)&&saDay(e.t)&&typeof e.k==='string'&&e.k?nf(e,['r']):null,
